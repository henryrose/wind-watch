<!doctype html>
<html lang="en">
<head>

  <script>

    function gtag(){dataLayer.push(arguments);}

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Wind Watch — Port Townsend Bay</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

<body>
  <main class="page" id="page">
    <!-- Brand lockup row (HANDOFF §10a); icon from docs/design/reference/brand_icon.py, small tier -->
    <div class="brand-row">
      <div class="brand" role="img" aria-label="Wind Watch"><svg class="brand-tile" width="28" height="28" viewBox="0 0 180 180" aria-hidden="true"><defs><clipPath id="wk-tile"><rect width="180" height="180" rx="40"/></clipPath></defs><g clip-path="url(#wk-tile)"><rect width="180" height="180" fill="#0B0E12"/></g><g transform="translate(116.8,102.2) rotate(103)"><line x1="-16" x2="-16" y1="62" y2="86" stroke="#4FA3D8" stroke-width="18" stroke-linecap="round"/><line x1="16" x2="16" y1="62" y2="92" stroke="#8DD44A" stroke-width="18" stroke-linecap="round"/><path d="M0,-50 L37.5,50 L0,20.0 L-37.5,50 Z" fill="#FFFFFF"/></g></svg><span class="wordmark" aria-hidden="true">Wind<span class="wordmark-watch"> Watch</span></span></div>
      <span class="brand-tagline">HRRR wind<span class="brand-place"> · Port Townsend Bay, WA</span></span>
    </div>
    <header class="header">
      <div class="header-left">
        <h1 id="location">Wind Watch</h1>
        <div class="trust" id="trust" aria-live="polite"></div>
      </div>
      <section class="hero" id="hero" aria-label="Loading"></section>
    </header>

    <p class="summary" id="summary"></p>

    <section class="card" id="chart-card">
      <div class="chart-head">
        <h2 id="chart-title">Hourly forecast</h2>
        <span class="chart-hint" id="chart-hint">hover or touch a bar for that hour</span>
      </div>
      <div class="chart-wrap" id="chart-wrap">
        <div id="chart-host"></div>
        <div class="tip hidden" id="chart-tip" aria-live="polite"></div>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <details class="table-card hidden" id="table-card">
      <summary>
        <span class="table-summary"><span class="table-title">Hourly table</span><span class="table-caption" id="table-caption"></span></span>
        <svg class="chev" viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><path d="M3,5 L7,9 L11,5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <section class="table-wrap" id="table-wrap" aria-label="Hourly table"></section>
    </details>

    <footer class="footer">
      <span id="attribution">Wind Watch · weather data by <a href="https://open-meteo.com/" rel="noopener">Open-Meteo.com</a> · HRRR 3 km</span>
      <span id="footer-right"></span>
    </footer>
  </main>
  <script type="module" src="app.js"></script>

</html>
